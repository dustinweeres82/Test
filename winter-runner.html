<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Winter Runner</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #e8e4dc;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: 'Georgia', serif;
    overflow: hidden;
  }
  h1 {
    font-size: 1.4rem;
    color: #2a2a2a;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 10px;
    opacity: 0.7;
  }
  canvas {
    border: 1.5px solid #2a2a2a;
    background: #f0ece4;
    image-rendering: crisp-edges;
    box-shadow: 3px 3px 0 #2a2a2a;
  }
  #info {
    margin-top: 10px;
    font-size: 0.8rem;
    color: #555;
    letter-spacing: 2px;
  }
</style>
</head>
<body>
<h1>Winter Runner</h1>
<canvas id="canvas" width="800" height="300"></canvas>
<div id="info">SPACE / TAP to jump &nbsp;|&nbsp; Double-jump allowed</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// --- Sketch helpers ---
function sketchLine(x1, y1, x2, y2, wobble = 1.2) {
  ctx.beginPath();
  ctx.moveTo(x1 + (Math.random() - 0.5) * wobble, y1 + (Math.random() - 0.5) * wobble);
  ctx.lineTo(x2 + (Math.random() - 0.5) * wobble, y2 + (Math.random() - 0.5) * wobble);
  ctx.stroke();
}

// Draw a bare winter tree (like in the image)
function drawBareTree(x, groundY, height, seed) {
  const rng = mulberry32(seed);
  ctx.save();
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 1.2;
  ctx.lineCap = 'round';

  function branch(bx, by, angle, len, depth) {
    if (depth === 0 || len < 3) return;
    const ex = bx + Math.cos(angle) * len;
    const ey = by + Math.sin(angle) * len;
    sketchLine(bx, by, ex, ey, 0.5);
    const spread = 0.4 + rng() * 0.3;
    branch(ex, ey, angle - spread, len * (0.6 + rng() * 0.15), depth - 1);
    branch(ex, ey, angle + spread, len * (0.6 + rng() * 0.15), depth - 1);
    if (rng() > 0.5 && depth > 2) {
      branch(ex, ey, angle + (rng() - 0.5) * 0.4, len * 0.45, depth - 2);
    }
  }

  ctx.lineWidth = 1.8;
  sketchLine(x, groundY, x + (rng() - 0.5) * 4, groundY - height * 0.5, 0.5);
  ctx.lineWidth = 1.2;
  branch(x, groundY - height * 0.5, -Math.PI / 2, height * 0.45, 4);

  ctx.restore();
}

// Mulberry32 seeded RNG for deterministic trees
function mulberry32(seed) {
  return function() {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// --- Game state ---
const GROUND = 240;
const GRAVITY = 0.6;
const JUMP_FORCE = -13;
const GAME_SPEED_INIT = 4;

let state = 'start'; // 'start', 'playing', 'dead'
let score = 0;
let hiScore = 0;
let frame = 0;
let gameSpeed = GAME_SPEED_INIT;

const player = {
  x: 100, y: GROUND,
  vy: 0,
  jumpsLeft: 2,
  w: 22, h: 38,
  legPhase: 0,
};

let trees = [];
let groundSeeds = [];
let particles = [];
let bgTrees = [];

function resetGame() {
  player.y = GROUND;
  player.vy = 0;
  player.jumpsLeft = 2;
  trees = [];
  particles = [];
  score = 0;
  frame = 0;
  gameSpeed = GAME_SPEED_INIT;
  // Pre-generate background trees
  bgTrees = [];
  for (let i = 0; i < 12; i++) {
    bgTrees.push({
      x: Math.random() * 900 - 50,
      h: 20 + Math.random() * 30,
      seed: Math.floor(Math.random() * 10000),
      alpha: 0.12 + Math.random() * 0.1,
      speed: 0.3 + Math.random() * 0.4,
    });
  }
}

function jump() {
  if (state === 'start') {
    state = 'playing';
    resetGame();
    return;
  }
  if (state === 'dead') {
    if (score > hiScore) hiScore = score;
    state = 'playing';
    resetGame();
    return;
  }
  if (player.jumpsLeft > 0) {
    player.vy = JUMP_FORCE + (player.jumpsLeft === 1 ? 1.5 : 0);
    player.jumpsLeft--;
    // Dust particles
    for (let i = 0; i < 6; i++) {
      particles.push({
        x: player.x, y: GROUND,
        vx: (Math.random() - 0.5) * 3,
        vy: -Math.random() * 2,
        life: 1,
      });
    }
  }
}

// Input
document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); jump(); }
});
canvas.addEventListener('click', jump);
canvas.addEventListener('touchstart', e => { e.preventDefault(); jump(); });

// Tree spawning intervals
let nextTree = 120;

function spawnTree() {
  const h = 35 + Math.random() * 45;
  trees.push({
    x: 820,
    h,
    seed: Math.floor(Math.random() * 99999),
    w: 14,
  });
  // cluster chance
  if (Math.random() < 0.3) {
    trees.push({
      x: 820 + 30 + Math.random() * 20,
      h: 28 + Math.random() * 30,
      seed: Math.floor(Math.random() * 99999),
      w: 10,
    });
  }
  nextTree = 80 + Math.random() * 100 - Math.min(score * 0.3, 40);
}

function drawSketchPerson(x, y, legPhase) {
  ctx.save();
  ctx.strokeStyle = '#1a1a1a';
  ctx.fillStyle = '#1a1a1a';
  ctx.lineWidth = 1.8;
  ctx.lineCap = 'round';

  const airborne = y < GROUND - 2;
  const lp = airborne ? 0 : legPhase;

  // Body
  const bx = x, by = y;
  // Legs
  const legSwing = Math.sin(lp) * 12;
  sketchLine(bx, by, bx - 6 + legSwing, by + 18, 0.5);    // front leg
  sketchLine(bx, by, bx + 6 - legSwing, by + 18, 0.5);    // back leg
  // Torso
  const lean = airborne ? -4 : Math.sin(lp * 0.5) * 1.5;
  sketchLine(bx + lean, by, bx + lean * 0.3, by - 18, 0.5);
  // Arms
  const armSwing = Math.sin(lp + Math.PI) * 8;
  sketchLine(bx + lean * 0.5, by - 14, bx + lean * 0.5 - 10 + armSwing, by - 6, 0.5);
  sketchLine(bx + lean * 0.5, by - 14, bx + lean * 0.5 + 10 - armSwing, by - 6, 0.5);
  // Head
  ctx.beginPath();
  ctx.arc(bx + lean, by - 23, 6, 0, Math.PI * 2);
  ctx.stroke();
  // Scarf detail
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = '#444';
  sketchLine(bx + lean - 4, by - 18, bx + lean + 4, by - 18, 0.3);

  ctx.restore();
}

function drawGround() {
  ctx.save();
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 1.2;
  // Slightly wobbly ground line
  ctx.beginPath();
  ctx.moveTo(0, GROUND);
  for (let px = 0; px < 820; px += 8) {
    ctx.lineTo(px, GROUND + Math.sin(px * 0.05 + frame * 0.02) * 0.8 + (Math.random() - 0.5) * 0.4);
  }
  ctx.stroke();
  ctx.restore();
}

function drawUI() {
  ctx.save();
  ctx.fillStyle = '#1a1a1a';
  ctx.font = '13px Georgia';
  ctx.letterSpacing = '2px';
  ctx.fillText(`Score: ${Math.floor(score)}`, 16, 24);
  if (hiScore > 0) ctx.fillText(`Best: ${Math.floor(hiScore)}`, 16, 42);
  ctx.restore();
}

function drawOverlay(msg, sub) {
  ctx.save();
  ctx.fillStyle = 'rgba(240,236,228,0.82)';
  ctx.fillRect(0, 0, 800, 300);
  ctx.fillStyle = '#1a1a1a';
  ctx.font = 'bold 26px Georgia';
  ctx.textAlign = 'center';
  ctx.fillText(msg, 400, 130);
  ctx.font = '14px Georgia';
  ctx.fillStyle = '#555';
  ctx.fillText(sub, 400, 160);
  ctx.restore();
}

// Collision (axis-aligned box vs tree trunk)
function checkCollision() {
  const px = player.x - 8, py = player.y - 38;
  const pw = 16, ph = 38;
  for (const t of trees) {
    const tx = t.x - 5, ty = GROUND - t.h;
    const tw = 10, th = t.h;
    if (px < tx + tw && px + pw > tx && py < ty + th && py + ph > ty) {
      return true;
    }
  }
  return false;
}

function update() {
  if (state !== 'playing') return;

  frame++;
  score += gameSpeed * 0.05;
  gameSpeed = GAME_SPEED_INIT + score * 0.015;
  player.legPhase += 0.22;

  // Gravity
  player.vy += GRAVITY;
  player.y += player.vy;
  if (player.y >= GROUND) {
    player.y = GROUND;
    player.vy = 0;
    player.jumpsLeft = 2;
  }

  // Trees
  nextTree--;
  if (nextTree <= 0) spawnTree();
  for (const t of trees) t.x -= gameSpeed;
  trees = trees.filter(t => t.x > -30);

  // Background trees
  for (const bt of bgTrees) {
    bt.x -= bt.speed;
    if (bt.x < -60) bt.x = 860 + Math.random() * 100;
  }

  // Particles
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy; p.vy += 0.1; p.life -= 0.05;
  }
  particles = particles.filter(p => p.life > 0);

  if (checkCollision()) {
    state = 'dead';
  }
}

function draw() {
  ctx.clearRect(0, 0, 800, 300);

  // Faint background texture
  ctx.save();
  ctx.globalAlpha = 0.03;
  for (let i = 0; i < 200; i++) {
    ctx.fillStyle = '#555';
    ctx.fillRect(Math.random() * 800, Math.random() * 300, 1, 1);
  }
  ctx.restore();

  // Background trees (faint)
  for (const bt of bgTrees) {
    ctx.save();
    ctx.globalAlpha = bt.alpha;
    drawBareTree(bt.x, GROUND, bt.h, bt.seed);
    ctx.restore();
  }

  drawGround();

  // Particles
  ctx.save();
  for (const p of particles) {
    ctx.globalAlpha = p.life * 0.7;
    ctx.fillStyle = '#555';
    ctx.beginPath();
    ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  // Obstacle trees
  for (const t of trees) {
    drawBareTree(t.x, GROUND, t.h, t.seed);
  }

  // Player
  if (state === 'playing' || state === 'dead') {
    drawSketchPerson(player.x, player.y, player.legPhase);
  }

  drawUI();

  if (state === 'start') {
    drawOverlay('WINTER RUNNER', 'Press SPACE or tap to begin');
  } else if (state === 'dead') {
    drawOverlay(
      `Score: ${Math.floor(score)}`,
      `${score > hiScore ? 'New best! ' : ''}Press SPACE to run again`
    );
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

resetGame();
loop();
</script>
</body>
</html>
